<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="filtros">
      <input type="search" id="buscador" placeholder="Buscar por nombre,provincia o categoría">
      
      <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
        <option value="Parrilla">Parrilla</option>
        <option value="Horno">Horno</option>
        <option value="Guiso">Guiso</option>
        <option value="Frito">Frito</option>
      </select>

      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Córdoba">Córdoba</option>
        <option value="Entre Ríos">Entre Ríos</option>
        <option value="Jujuy">Jujuy</option>
        <option value="Salta">Salta</option>
        <option value="Santa Fe">Santa Fe</option>
        <option value="Tucumán">Tucumán</option>
      </select>

      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="agregarComida">
        <h2>Agregar Comida</h2>
        <label for="nombre">Nombre de la comida</label>
       <input type="text"  id = "nombre" placeholder="Nombre de la comida" required>

       <label for="categoria">Categoria de la comida</label>
       <input type="text" id="categoria" placeholder="Categoria de la comida">

       <label for="provincia">Provincia de la comida</label>
       <input type="text" id="provincia" placeholder="Provincia de la comida">

       <label for="ingredientes">Ingredientes de la comida</label>
       <input type="text" id="ingredientes" placeholder="Ingredientes de la comida">

       <button type="submit">Agregar</button>

      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
